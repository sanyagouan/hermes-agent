name: Build Android ARM64 Wheels for Termux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version"
        required: false
        default: "3.14"

permissions:
  contents: read
  actions: write

jobs:
  build-android-wheels:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    
    env:
      ANDROID_API: 24
      TARGET: aarch64-linux-android
      PYDANTIC_CORE_VERSION: v2.41.5
      JITER_VERSION: v0.16.0
      UVLOOP_VERSION: v0.22.1
      CRYPTOGRAPHY_VERSION: 50.0.0
      MATURIN_VERSION: v1.14.1
      PEP508_RS_VERSION: v0.9.2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            pkg-config \
            libssl-dev \
            cmake \
            protobuf-compiler \
            2>/dev/null || true
      
      - name: Install Android NDK ARM64 host (direct download)
        run: |
          # Download NDK for ARM64 Linux host (NOT x86_64 via sdkmanager)
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux-arm64.zip
          unzip -q android-ndk-r27c-linux-arm64.zip
          NDK_PATH=/tmp/android-ndk-r27c
          
          echo "NDK found at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          
          # Configure toolchain
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-arm64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> $GITHUB_ENV
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: rust-src
      
      - name: Install Zig (required by cargo-zigbuild)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0
      
      - name: Install cargo-zigbuild
        run: |
          cargo install cargo-zigbuild --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: arm64
      
      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel maturin build
          pip install auditwheel patchelf
      
      - name: Build pydantic-core wheel
        run: |
          mkdir -p ${{ github.workspace }}/wheels
          cd /tmp
          git clone --depth 1 --branch ${{ env.PYDANTIC_CORE_VERSION }} https://github.com/pydantic/pydantic-core.git
          cd pydantic-core
          cargo zigbuild --target ${{ env.TARGET }} --release -p pydantic-core
          maturin build --release --target ${{ env.TARGET }} --out ${{ github.workspace }}/wheels
      
      - name: Build jiter wheel
        run: |
          cd /tmp
          git clone --depth 1 --branch ${{ env.JITER_VERSION }} https://github.com/pydantic/jiter.git
          cd jiter
          cargo zigbuild --target ${{ env.TARGET }} --release
          maturin build --release --target ${{ env.TARGET }} --out ${{ github.workspace }}/wheels
      
      - name: Build uvloop wheel
        run: |
          cd /tmp
          git clone --depth 1 --branch ${{ env.UVLOOP_VERSION }} https://github.com/MagicStack/uvloop.git
          cd uvloop
          cargo zigbuild --target ${{ env.TARGET }} --release
          maturin build --release --target ${{ env.TARGET }} --out ${{ github.workspace }}/wheels
      
      - name: Build cryptography wheel
        run: |
          cd /tmp
          git clone --depth 1 --branch ${{ env.CRYPTOGRAPHY_VERSION }} https://github.com/pyca/cryptography.git
          cd cryptography
          cargo zigbuild --target ${{ env.TARGET }} --release -p cryptography-cffi -p cryptography-openssl
          maturin build --release --target ${{ env.TARGET }} --out ${{ github.workspace }}/wheels
      
      - name: Build maturin wheel
        run: |
          pip wheel maturin==1.14.1 -w ${{ github.workspace }}/wheels --no-deps
      
      - name: Build pep508_rs wheel
        run: |
          cd /tmp
          git clone --depth 1 --branch ${{ env.PEP508_RS_VERSION }} https://github.com/konstin/pep508_rs.git
          cd pep508_rs
          cargo zigbuild --target ${{ env.TARGET }} --release
          maturin build --release --target ${{ env.TARGET }} --out ${{ github.workspace }}/wheels
      
      - name: Verify wheel tags
        run: |
          ls -la ${{ github.workspace }}/wheels/
          for whl in ${{ github.workspace }}/wheels/*.whl; do
            echo "=== $whl ==="
            unzip -l "$whl" | head -20
          done
      
      - name: Upload Android wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-android-wheels-cp314
          path: ${{ github.workspace }}/wheels/*.whl
          retention-days: 30
          compression-level: 6
