name: Build ARM64 Wheels for Termux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version (cp314 = 3.14)'
        required: false
        default: '3.14'

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install build tools
        run: |
          pip install --upgrade pip setuptools wheel maturin
          pip install build auditwheel patchelf

      - name: Build hermes-agent with maturin
        run: |
          mkdir -p /tmp/wheels
          
          # hermes-agent uses maturin for Rust extensions
          maturin build --release --out /tmp/wheels
          
      - name: Build pydantic-core wheel
        run: |
          pip wheel pydantic-core==2.48.0 -w /tmp/wheels
          
      - name: Build maturin wheel
        run: |
          pip wheel maturin==1.14.1 -w /tmp/wheels
          
      - name: Build cryptography wheel
        run: |
          pip wheel cryptography==48.0.1 -w /tmp/wheels
          
      - name: Build other Rust deps
        run: |
          pip wheel attrs==25.3.0 -w /tmp/wheels || true
          pip wheel markupsafe==3.2.1 -w /tmp/wheels || true
          pip wheel jiter==0.10.0 -w /tmp/wheels || true

      - name: List built wheels
        run: |
          ls -lah /tmp/wheels/

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-arm64-wheels
          path: /tmp/wheels/*.whl
          retention-days: 30
