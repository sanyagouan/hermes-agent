name: Build ARM64 Wheels for Termux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version (cp314 = 3.14)'
        required: false
        default: '3.14'

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install build tools
        run: |
          pip install --upgrade pip setuptools wheel maturin
          pip install build auditwheel patchelf

      - name: Build pydantic-core wheel (Rust via maturin)
        run: |
          mkdir -p /tmp/wheels
          pip wheel pydantic-core==2.48.0 -w /tmp/wheels --verbose
          
      - name: Build maturin wheel (Rust)
        run: |
          pip wheel maturin==1.14.1 -w /tmp/wheels --verbose
          
      - name: Build cryptography wheel (Rust)
        run: |
          pip wheel cryptography==48.0.1 -w /tmp/wheels --verbose
          
      - name: Build attrs wheel
        run: |
          pip wheel attrs -w /tmp/wheels --verbose || true
          
      - name: Build markupsafe wheel
        run: |
          pip wheel markupsafe -w /tmp/wheels --verbose || true
          
      - name: Build jiter wheel (Rust)
        run: |
          pip wheel jiter==0.10.0 -w /tmp/wheels --verbose || true

      - name: Test install with pre-built wheels
        run: |
          pip install /tmp/wheels/*.whl
          pip install -e . --verbose
          hermes --version

      - name: List built wheels (dependencies only - hermes-agent is installed from source)
        run: |
          ls -lah /tmp/wheels/

      - name: Upload wheels artifact (Rust deps only)
        uses: actions/upload-artifact@v4
        with:
          name: hermes-arm64-rust-deps-wheels
          path: /tmp/wheels/*.whl
          retention-days: 30
